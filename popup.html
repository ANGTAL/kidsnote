<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>키즈노트 사진 다운로더</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --neon-glow: linear-gradient(90deg, #38bdf8 0%, #3b82f6 100%);
      --album-glow: linear-gradient(90deg, #10b981 0%, #059669 100%);
      --btn-text: #ffffff;
    }

    body { width: 320px; padding: 16px; margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg-gradient); color: var(--text-main); overflow: hidden; }
    .bento-grid { display: flex; flex-direction: column; gap: 12px; }
    .tile-header { background: var(--card-bg); backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; text-align: center; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05); }
    h4 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(180deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tile-inputs { background: var(--card-bg); backdrop-filter: blur(24px); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .input-group { display: flex; justify-content: space-between; align-items: center; }
    .input-group span { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }
    input[type="date"] { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: var(--text-main); padding: 8px 12px; font-size: 12px; font-weight: 600; outline: none; transition: all 0.3s ease; }
    input[type="date"]:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
    .tile-action { display: flex; gap: 10px; }
    button { flex: 1; border: none; padding: 14px 0; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--btn-text); transition: all 0.25s ease; }
    #btn-reports { background: var(--neon-glow); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15); }
    #btn-albums { background: var(--album-glow); box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15); }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { background: #1e293b !important; color: #475569 !important; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .tile-status { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    #status { font-size: 12px; text-align: center; line-height: 1.5; color: #94a3b8; word-break: keep-all; }
    .success { color: #34d399 !important; font-weight: 600; }
    .error { color: #f87171 !important; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bento-grid">
    <div class="tile-header">
      <h4>키즈노트 사진 다운로드</h4>
    </div>
    <div class="tile-inputs">
      <div class="input-group"><span>시작일</span><input type="date" id="start-date" /></div>
      <div class="input-group"><span>종료일</span><input type="date" id="end-date" /></div>
    </div>
    <div class="tile-action">
      <button id="btn-reports">알림장 다운로드</button>
      <button id="btn-albums">앨범 다운로드</button>
    </div>
    <div class="tile-status"><div id="status">기간을 설정하고 다운로드할 항목을 클릭하세요.</div></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
